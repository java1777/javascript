<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="clock"></p>

    <script>
      setInterval(function () {
        let now = new Date();
        document.getElementById("clock").innerText = now.toLocaleTimeString();
      }, 1000);
    </script>
  </body>
</html>
