<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      id="lamp"
      style="width: 300px; height: 300px; background: greenyellow"
    ></div>
    <button onclick="toggle()">Switch</button>

    <script>
      let isOn = false;

      function toggle() {
        isOn = !isOn;
        lamp.style.background = isOn ? "yellow" : "black";
      }
    </script>
  </body>
</html>
